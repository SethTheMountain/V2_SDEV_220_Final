{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee - Menards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/scripts.js' %}" defer></script>
</head>
<body>
    <div class="container">
        <h1>Edit Employee</h1>
        {% if messages %}
            {% for message in messages %}
                <p class="{% if message.tags == 'success' %}success{% else %}error{% endif %}">{{ message }}</p>
            {% endfor %}
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" pattern="[A-Za-z]+" title="Letters only" value="{{ employee.first_name|default:'Unknown' }}" required>
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" pattern="[A-Za-z]+" title="Letters only" value="{{ employee.last_name|default:'Employee' }}" required>
            <label for="employee_id">Employee ID:</label>
            <input type="text" id="employee_id" name="employee_id" pattern="\d+" title="Numbers only" value="{{ employee.employee_id|default:'N/A' }}" required>
            <label for="address">Address:</label>
            <textarea id="address" name="address" required>{{ employee.address|default:'N/A' }}</textarea>
            <label for="phone_number">Phone Number:</label>
            <input type="tel" id="phone_number" name="phone_number" pattern="\d{3}-\d{3}-\d{4}" title="Format: 111-111-1111" value="{{ employee.phone_number|default:'000-000-0000' }}" required>
            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="" disabled>Select Department</option>
                <option value="Electrical" {% if employee.department == "Electrical" %}selected{% endif %}>Electrical</option>
                <option value="Plumbing" {% if employee.department == "Plumbing" %}selected{% endif %}>Plumbing</option>
                <option value="Front-Desk" {% if employee.department == "Front-Desk" %}selected{% endif %}>Front-Desk</option>
                <option value="Wall Coverings" {% if employee.department == "Wall Coverings" %}selected{% endif %}>Wall Coverings</option>
                <option value="Flooring" {% if employee.department == "Flooring" %}selected{% endif %}>Flooring</option>
                <option value="Hardware" {% if employee.department == "Hardware" %}selected{% endif %}>Hardware</option>
                <option value="Receiving" {% if employee.department == "Receiving" %}selected{% endif %}>Receiving</option>
                <option value="Building Materials" {% if employee.department == "Building Materials" %}selected{% endif %}>Building Materials</option>
            </select>
            <label for="position">Position:</label>
            <select id="position" name="position" required>
                <option value="" disabled selected>Select Position</option>
            </select>
            <label for="hours_per_week">Hours per Week:</label>
            <input type="number" step="0.1" id="hours_per_week" name="hours_per_week" value="{{ employee.hours_per_week|default:'0' }}" min="0" required>
            <label for="hourly_salary">Hourly Salary ($):</label>
            <input type="number" step="0.01" id="hourly_salary" name="hourly_salary" value="{{ employee.hourly_salary|default:'0.00' }}" min="0" required>
            <button type="submit">Save Changes</button>
        </form>
        <div class="buttons" style="margin-top: 1rem;">
            <button data-url="{% url 'new_admin_dashboard' %}">Cancel</button>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const departmentSelect = document.getElementById('department');
            const positionSelect = document.getElementById('position');
            const initialPosition = "{{ employee.position|escapejs|default:'' }}";

            // Initialize position dropdown based on current department
            if (departmentSelect.value) {
                populatePositions(departmentSelect, positionSelect, initialPosition);
            }

            // Update position dropdown when department changes
            departmentSelect.addEventListener('change', () => {
                populatePositions(departmentSelect, positionSelect, null);
            });
        });
    </script>
</body>
</html>
